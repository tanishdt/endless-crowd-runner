name: Acquire Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate .alf file
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            unityci/editor:ubuntu-2022.3.20f1-android-3 \
            unity-editor -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true
          ls -la

      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-activation-file
          path: '**/*.alf'
